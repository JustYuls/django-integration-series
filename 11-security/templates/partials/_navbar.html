<nav class="navbar">
  <strong>Campus Booking Hub</strong>
  <a href="{% url 'home' %}">Home</a>
  <a href="{% url 'rooms:room_list' %}">Rooms</a>
  {% if user.is_authenticated %}
    <a href="{% url 'bookings:booking_list' %}">My bookings</a>
    <a href="{% url 'bookings:booking_create' %}">New booking</a>
  {% endif %}
  {% now "Y" as this_year %}
  <a href="{% url 'holiday_api:holiday_list' this_year %}">Holidays</a>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="inline">
      {% csrf_token %}
      <span>{{ user.get_username }}</span>
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Log in</a>
    <a href="{% url 'signup' %}">Sign up</a>
  {% endif %}
</nav>
