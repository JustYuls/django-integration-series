{% extends "base.html" %}

{% block title %}New booking | Campus Booking Hub{% endblock %}

{% block content %}
  <h1>New booking</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <p>
        {{ field.label_tag }} {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button type="submit">Save booking</button>
  </form>
{% endblock %}
